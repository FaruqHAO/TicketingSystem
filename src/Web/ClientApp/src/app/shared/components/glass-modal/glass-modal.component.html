<dialog #dialog class="gmodal" [class]="'gmodal--' + size()" (close)="onClose()" (click)="onDialogClick($event)">
  <div class="gmodal__panel glass glass-sheen">
    <header class="gmodal__head">
      <div class="gmodal__titles">
        @if (heading()) {
          <h2 class="gmodal__heading">{{ heading() }}</h2>
        }
        @if (sub()) {
          <p class="gmodal__sub dim">{{ sub() }}</p>
        }
      </div>
      <button glassBtn variant="ghost" size="sm" class="gmodal__close" type="button" aria-label="Close" (click)="open.set(false)">
        <lucide-icon name="x" [size]="18" />
      </button>
    </header>

    <div class="gmodal__body">
      <ng-content />
    </div>

    <ng-content select="[modalFoot]" />
  </div>
</dialog>
