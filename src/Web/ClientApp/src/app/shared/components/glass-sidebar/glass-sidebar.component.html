@if (open()) {
  <!-- Drawer scrim. Only paints below the desktop breakpoint; harmless above it. -->
  <button class="gsb__scrim" type="button" aria-label="Close navigation" (click)="close()"></button>
}

<div class="gsb__pane glass">
  <div class="gsb__head">
    <a class="gsb__brand" routerLink="/" (click)="close()">
      <span class="gsb__mark" aria-hidden="true"></span>
      <span class="gsb__titles">
        <span class="gsb__wordmark">{{ brand() }}</span>
        @if (context()) {
          <span class="gsb__context">{{ context() }}</span>
        }
      </span>
    </a>

    <button class="gsb__close" type="button" aria-label="Close navigation" (click)="close()">
      <lucide-icon name="x" [size]="18" />
    </button>
  </div>

  <nav class="gsb__nav" aria-label="Dashboard">
    @for (section of sections(); track section.title ?? $index) {
      <div class="gsb__section">
        @if (section.title) {
          <p class="eyebrow gsb__section-title">{{ section.title }}</p>
        }
        <ul class="gsb__items">
          @for (item of section.items; track item.path) {
            <li>
              <a
                class="gsb__item"
                [routerLink]="item.path"
                routerLinkActive="gsb__item--active"
                [routerLinkActiveOptions]="{ exact: !!item.exact }"
                (click)="close()"
              >
                <lucide-icon class="gsb__icon" [name]="item.icon" [size]="17" aria-hidden="true" />
                <span class="gsb__label">{{ item.label }}</span>
                @if (item.badge) {
                  <glass-badge tone="cyan" [dot]="false">{{ item.badge }}</glass-badge>
                }
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="gsb__foot">
    <ng-content select="[sidebarFoot]" />
  </div>
</div>
