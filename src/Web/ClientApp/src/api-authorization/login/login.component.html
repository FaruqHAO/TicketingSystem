<auth-shell eyebrow="Welcome back" heading="Sign in to your desk" sub="Your role decides what opens next.">
  <form class="lg" (ngSubmit)="login()">
    <div class="field">
      <label class="label" for="email">Work email</label>
      <input
        class="input"
        type="email"
        id="email"
        name="email"
        placeholder="you@company.com"
        autocomplete="username"
        [(ngModel)]="email"
        [attr.aria-invalid]="invalid ? true : null"
        aria-describedby="login-error"
        (ngModelChange)="invalid = false"
      />
    </div>

    <div class="field">
      <label class="label" for="password">Password</label>
      <input
        class="input"
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        [attr.aria-invalid]="invalid ? true : null"
        aria-describedby="login-error"
        (ngModelChange)="invalid = false"
      />
    </div>

    @if (invalid) {
      <p class="lg__error" id="login-error" role="alert">
        <lucide-icon name="shield-check" [size]="16" aria-hidden="true" />
        <span>
          That email and password don't match an account.
          <span class="faint">Five wrong attempts locks the account for 15 minutes.</span>
        </span>
      </p>
    }

    <button glassBtn variant="primary" size="lg" type="submit" [block]="true" [loading]="busy">
      Sign in
      <lucide-icon name="arrow-right" [size]="16" aria-hidden="true" />
    </button>
  </form>

  <p authFoot>
    No account yet?
    <a class="lg__link" routerLink="/register">Create one</a>
  </p>
</auth-shell>
